# Render Blueprint: backend API + Postgres
# Dashboard: New → Blueprint → connect this repo → apply
# Docs: https://render.com/docs/infrastructure-as-code
#
# Free Postgres expires after 30 days — fine for a first deploy / demo.

databases:
  - name: raqs-db
    plan: free
    databaseName: raqs_is
    user: raqs

services:
  - type: web
    name: raqs-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations also run in the Docker CMD; this is belt-and-suspenders on Blueprint deploys.
    healthCheckPath: /health/db
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raqs-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        sync: false
